# Pinned versions for REPRODUCIBILITY of an archived release.
#
# requirements.txt uses loose lower bounds so pip can pick prebuilt wheels for
# whatever Python the user has — good for installation, bad for reproducibility,
# because a future FastAPI release can break an archived version and the DOI
# would then point at something that no longer runs.
#
# This file records a known-good set. Regenerate with:
#     pip freeze > backend/requirements.lock
# Install a reproducible environment with:
#     pip install -r backend/requirements.lock
#
